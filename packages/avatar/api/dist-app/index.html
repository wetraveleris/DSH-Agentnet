<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before styles load to avoid a bright flash on reload.
      (function () {
        var theme;
        try { theme = localStorage.getItem('easel_theme'); } catch (_) { /* Storage may be unavailable. */ }
        if (theme !== 'light' && theme !== 'dark') {
          theme = 'dark';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <script>
      // 子路径代理下必须带结尾斜杠，否则相对资源路径(./assets)会解析到上一级 → 404 白屏。
      // 若当前路径无结尾斜杠且末段不像文件名(无扩展名)，自动补斜杠后重载。
      (function () {
        var p = location.pathname;
        var last = p.split('/').pop();
        if (p && !p.endsWith('/') && !/\.[a-z0-9]+$/i.test(last)) {
          location.replace(p + '/' + location.search + location.hash);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./static/avatar-mark.svg" />
    <meta name="theme-color" content="#0B0D10" />
    <!-- Google Fonts 改为非阻塞加载：stylesheet 的 <link> 默认阻塞首屏渲染，而
         fonts.googleapis.com 在中国大陆网络下是 net::ERR_TIMED_OUT，于是整个页面要
         等到连接超时才画出来。media="print" + onload 切回 all 是标准的 non-blocking
         写法：拿得到就用设计字体，拿不到就安静地回退到 index.css 里的本地字体栈。
         两组字体合并成一次请求，preconnect 也去重。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Manrope:wght@400;500;600&family=Noto+Serif+SC:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avatar · 你的 IP，一条流水线</title>
    <script type="module" crossorigin src="./assets/index-ChNyzWaT.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-MCCctY13.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
